services:

  postgres:
    image: postgres:16
    container_name: calmfit-postgres
    restart: always
    environment:
      POSTGRES_USER: calmfit
      POSTGRES_PASSWORD: calmfit123
      POSTGRES_DB: calmfit_db
    ports:
      - "5433:5432"
    volumes:
      - calmfit_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: calmfit-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: calmfit-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/calmfit_db
      SPRING_DATASOURCE_USERNAME: calmfit
      SPRING_DATASOURCE_PASSWORD: calmfit123
      SPRING_DATA_REDIS_HOST: redis

volumes:
  calmfit_pg_data: