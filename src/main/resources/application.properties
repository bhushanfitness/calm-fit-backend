spring.application.name=calm-fit

# ======================
# DATABASE (POSTGRES)
# ======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/calmfit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:calmfit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:calmfit123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ======================
# CORS
# ======================
app.cors.allowed-origin=https://calmfit.in,https://www.calmfit.in,https://calm-fit-frontend.vercel.app,http://localhost:5173
# ======================
# REDIS
# ======================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# Use Redis for session storage
#spring.session.store-type=redis

# ======================
# SESSION
# ======================
server.servlet.session.timeout=30d

# ======================
# DEBUG
# ======================
logging.level.org.springframework.security=DEBUG